name: GitHub Repository Collector

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      collection_type:
        description: 'Type of collection'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - quick
          - analysis
      output_directory:
        description: 'Custom output directory (optional)'
        required: false
        type: string

jobs:
  collect-repositories:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd tools/github-repository-collector
          pip install -r requirements.txt
      
      - name: Make bash script executable
        run: |
          chmod +x tools/github-repository-collector/collect_hlpflcg_repos.sh
      
      - name: Run collection (Bash Script - Default)
        if: github.event.inputs.collection_type == '' || github.event.inputs.collection_type == 'full'
        run: |
          cd tools/github-repository-collector
          ./collect_hlpflcg_repos.sh
      
      - name: Run collection (Python Tool - Analysis)
        if: github.event.inputs.collection_type == 'analysis'
        run: |
          cd tools/github-repository-collector
          python3 hlpflcg_collector.py \
            --config config_hlpflcg_individual.yaml \
            --output ${{ github.event.inputs.output_directory || 'hlpflcg_collection_analysis' }} \
            --verbose
      
      - name: Generate collection report
        run: |
          cd tools/github-repository-collector
          
          # Create report
          REPORT_FILE="collection_report_$(date +%Y%m%d_%H%M%S).md"
          
          cat > "$REPORT_FILE" << EOF
          # HLPFL Repository Collection Report
          
          **Collection Date:** $(date)
          **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Triggered By:** ${{ github.event_name }}
          
          ## Collection Summary
          
          EOF
          
          if [ -d "hlpflcg_collection" ]; then
            echo "- ✅ Collection completed successfully" >> "$REPORT_FILE"
            echo "- 📊 Total repositories: $(ls -1 hlpflcg_collection/ | grep -v README.md | wc -l)" >> "$REPORT_FILE"
            echo "- 📁 Total size: $(du -sh hlpflcg_collection/ | cut -f1)" >> "$REPORT_FILE"
            echo "- 📄 Total files: $(find hlpflcg_collection/ -type f | wc -l)" >> "$REPORT_FILE"
            
            echo "" >> "$REPORT_FILE"
            echo "## Repository Breakdown" >> "$REPORT_FILE"
            echo "" >> "$REPORT_FILE"
            
            for repo in hlpflcg_collection/*/; do
              if [ -d "$repo" ]; then
                repo_name=$(basename "$repo")
                repo_size=$(du -sh "$repo" | cut -f1)
                repo_files=$(find "$repo" -type f | wc -l)
                echo "- **$repo_name**: $repo_size, $repo_files files" >> "$REPORT_FILE"
              fi
            done
          else
            echo "- ❌ Collection failed" >> "$REPORT_FILE"
          fi
          
          echo "" >> "$REPORT_FILE"
          echo "## Next Steps" >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          echo "- Review collected repositories in \`hlpflcg_collection/\`" >> "$REPORT_FILE"
          echo "- Check detailed analysis in \`detailed_analysis.md\`" >> "$REPORT_FILE"
          echo "- Update configuration as needed" >> "$REPORT_FILE"
          
          echo "Report generated: $REPORT_FILE"
      
      - name: Upload collection artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hlpfl-repository-collection-${{ github.run_number }}
          path: |
            tools/github-repository-collector/hlpflcg_collection/
            tools/github-repository-collector/collection_report_*.md
          retention-days: 30
      
      - name: Commit and push changes (if any)
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Add changes if collection was modified
          if [ -d "tools/github-repository-collector/hlpflcg_collection" ]; then
            git add tools/github-repository-collector/collected_repos/
            git add tools/github-repository-collector/collection_report_*.md
            git add tools/github-repository-collector/*.log
          fi
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Automated repository collection - $(date +%Y-%m-%d)
            
            - Collected HLPFL repositories via GitHub Action
            - Generated collection report
            - Updated collected_repos/ directory
            
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            Triggered by: ${{ github.event_name }}"
            
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          fi
      
      - name: Create summary
        run: |
          echo "## 🚀 Collection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "tools/github-repository-collector/hlpflcg_collection" ]; then
            echo "✅ **Collection completed successfully**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📊 **Statistics:**" >> $GITHUB_STEP_SUMMARY
            echo "- Repositories: $(ls -1 tools/github-repository-collector/hlpflcg_collection/ | grep -v README.md | wc -l)" >> $GITHUB_STEP_SUMMARY
            echo "- Total Size: $(du -sh tools/github-repository-collector/hlpflcg_collection/ | cut -f1)" >> $GITHUB_STEP_SUMMARY
            echo "- Files: $(find tools/github-repository-collector/hlpflcg_collection/ -type f | wc -l)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Artifacts:**" >> $GITHUB_STEP_SUMMARY
            echo "- Download: [hlpfl-repository-collection-${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Collection failed**" >> $GITHUB_STEP_SUMMARY
            echo "Check the logs for details" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY

  # Separate job for analysis
  analyze-repositories:
    runs-on: ubuntu-latest
    needs: collect-repositories
    if: github.event.inputs.collection_type == 'analysis' || github.event.inputs.collection_type == ''
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install analysis tools
        run: |
          pip install requests pyyaml tqdm
      
      - name: Run detailed analysis
        run: |
          cd tools/github-repository-collector
          
          if [ -d "hlpflcg_collection" ]; then
            python3 -c "
import os
import json
from datetime import datetime

def analyze_collection():
    collection_dir = 'hlpflcg_collection'
    analysis = {
        'timestamp': datetime.now().isoformat(),
        'repositories': {},
        'summary': {}
    }
    
    total_size = 0
    total_files = 0
    
    for repo_name in os.listdir(collection_dir):
        repo_path = os.path.join(collection_dir, repo_name)
        if os.path.isdir(repo_path) and repo_name != 'collected_repos':
            # Count files and calculate size
            file_count = 0
            repo_size = 0
            
            for root, dirs, files in os.walk(repo_path):
                file_count += len(files)
                for file in files:
                    file_path = os.path.join(root, file)
                    try:
                        repo_size += os.path.getsize(file_path)
                    except:
                        pass
            
            analysis['repositories'][repo_name] = {
                'file_count': file_count,
                'size_bytes': repo_size,
                'size_mb': round(repo_size / (1024 * 1024), 2)
            }
            
            total_size += repo_size
            total_files += file_count
    
    analysis['summary'] = {
        'total_repositories': len(analysis['repositories']),
        'total_files': total_files,
        'total_size_mb': round(total_size / (1024 * 1024), 2)
    }
    
    # Save analysis
    with open('collection_analysis.json', 'w') as f:
        json.dump(analysis, f, indent=2)
    
    print('Analysis completed successfully!')
    print(f'Total repositories: {analysis[&quot;summary&quot;][&quot;total_repositories&quot;]}')
    print(f'Total files: {analysis[&quot;summary&quot;][&quot;total_files&quot;]}')
    print(f'Total size: {analysis[&quot;summary&quot;][&quot;total_size_mb&quot;]} MB')

analyze_collection()
"
          fi
      
      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: collection-analysis-${{ github.run_number }}
          path: tools/github-repository-collector/collection_analysis.json
          retention-days: 30