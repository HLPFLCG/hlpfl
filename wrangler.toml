name = "hlpfl-space"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Account ID (replace with your Cloudflare account ID)
account_id = "8c74a072236761cf6126371f0b20c5a9"

# Workers AI
[ai]
binding = "AI"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "hlpfl-space-db"
database_id = "0d9630c8-9a7f-4511-88e7-10146f64d9ba"

# R2 Storage
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "hlpfl-space-media"

# KV Namespaces
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "77789f49a21a438da609142a6a00190c"

[[kv_namespaces]]
binding = "SESSIONS"
id = "674ad8838d54499a86259fd2292ab218"

# Environment Variables
[vars]
ENVIRONMENT = "production"
API_VERSION = "v1"

# Secrets (set with: wrangler secret put SECRET_NAME)
# JWT_SECRET
# TWITTER_CLIENT_ID
# TWITTER_CLIENT_SECRET
# LINKEDIN_CLIENT_ID
# LINKEDIN_CLIENT_SECRET
# FACEBOOK_APP_ID
# FACEBOOK_APP_SECRET
# INSTAGRAM_CLIENT_ID
# INSTAGRAM_CLIENT_SECRET
# OPENAI_API_KEY

# Routes
routes = [
  { pattern = "api.hlpfl.org/*", zone_name = "hlpfl.org" }
]

# Development
[env.development]
name = "hlpfl-space-dev"
vars = { ENVIRONMENT = "development", API_VERSION = "v1" }

[[env.development.d1_databases]]
binding = "DB"
database_name = "hlpfl-space-db-dev"
database_id = "246a5fcb-73ab-4668-9493-69acb4e3ef00"

[[env.development.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "hlpfl-space-media-dev"

[[env.development.kv_namespaces]]
binding = "RATE_LIMIT"
preview_id = "8e7b5b207ac24676aa27c88caa91068f"

[[env.development.kv_namespaces]]
binding = "SESSIONS"
preview_id = "200c5a7c2a814a2faf0c047215e7ab32"

# Staging
[env.staging]
name = "hlpfl-space-staging"
vars = { ENVIRONMENT = "staging", API_VERSION = "v1" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "hlpfl-space-db-staging"
database_id = "be2ff60d-0623-405f-82cb-d8cb330efbde"

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "hlpfl-space-media-staging"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMIT"
id = "4102d656cd4d46b4ad6db5b66fde5a05"

[[env.staging.kv_namespaces]]
binding = "SESSIONS"
id = "98e1a4fbc1f24b5b84e8d2b4a979ef65"

[env.staging.ai]
binding = "AI"